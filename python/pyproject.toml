[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "omle-spark"
dynamic = ["version"]
description = "PySpark wrapper for OMLE model scoring"
requires-python = ">=3.10"
# 3.5 is the floor because that is what the Scala 2.12 jar is compiled
# against and what CI exercises; the jar loads on Spark 3.5.x (Scala 2.12)
# and 4.x (Scala 2.13). 3.3/3.4 were never built or tested against.
dependencies = ["pyspark>=3.5"]
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OMLE contributors" }]
keywords = ["machine-learning", "inference", "spark", "pyspark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/openmle/omle-runtime"
Source = "https://github.com/openmle/omle-runtime"
Issues = "https://github.com/openmle/omle-runtime/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["omle_spark*"]

# The JARs are staged into omle_spark/jars/ by spark/scripts/stage_jars.py
# before the wheel is built; they are build output, not sources, so they are
# gitignored and have to be declared here to reach the wheel.
[tool.setuptools.package-data]
omle_spark = ["jars/*.jar"]

[tool.setuptools_scm]
# One level down from the git root. It was "../.." while this package lived at
# omle-runtime/spark/python/; left unchanged after the move it resolves to the
# directory *above* the repository, which is not a checkout, and setuptools-scm
# then fails to infer any version at all.
root = ".."
version_file = "omle_spark/_version.py"

# Ruff config lives here rather than at the repo root because the Python
# package is the only Python in this repository; scripts/ is linted against the
# same rules by pointing ruff at both paths.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
    # Assigning a lambda is idiomatic in the benchmark-style helpers here.
    "E731",
]
